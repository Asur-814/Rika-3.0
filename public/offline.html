<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Rika Assistant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-style: italic;
            font-weight: 900;
            letter-spacing: -0.05em;
        }
        p {
            color: #94a3b8;
            max-width: 400px;
            line-height: 1.5;
        }
        .retry-button {
            margin-top: 2rem;
            padding: 12px 24px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .retry-button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h1>RIKA</h1>
    <p>You are currently offline. Please check your internet connection and try again.</p>
    <button class="retry-button" onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
